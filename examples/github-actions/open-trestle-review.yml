# Open Trestle pull-request review (example).
#
# STATUS: this workflow has run on a GitHub-hosted ubuntu-24.04 runner in a
# private repository with the openrouter-zdr provider: build, install, setup,
# review with repository checks, reviewdog comments and the job summary. The
# upload-sarif step is unverified, because that repository had no code scanning.
# Read examples/github-actions/README.md before copying it.
name: Open Trestle review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: open-trestle-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimal token scope. security-events is needed only for upload-sarif;
# pull-requests is needed only for reviewdog's inline review comments.
permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  # PLACEHOLDER: pick two different models your provider account can use.
  # The review refuses to start while either still begins with YOUR_.
  GENERATION_MODEL: YOUR_GENERATION_MODEL
  VERIFICATION_MODEL: YOUR_DIFFERENT_VERIFICATION_MODEL
  # PLACEHOLDER: pin to a release tag or a full commit SHA once releases exist.
  OPEN_TRESTLE_REF: main
  OPEN_TRESTLE_REPOSITORY: https://github.com/georgejieh/open-trestle.git

jobs:
  review:
    # Fork pull requests receive no repository secrets and a read-only token, so
    # this job would fail there. Skip them rather than pretend to review.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Full history: the review needs the head commit and the merge base of the
      # pull request's base and head, and `git merge-base` needs the history
      # between them. A shallow checkout makes model-review stop with an
      # explanation and no model call.
      - name: Check out the pull request head with full history
        uses: actions/checkout@v4 # Pin to a full commit SHA in your repository.
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Refuse to run with placeholder models
        run: |
          case "$GENERATION_MODEL:$VERIFICATION_MODEL" in
            *YOUR_*) echo "::error::Set GENERATION_MODEL and VERIFICATION_MODEL in the workflow env."; exit 2 ;;
          esac
          if [ "$GENERATION_MODEL" = "$VERIFICATION_MODEL" ]; then
            echo "::error::The generation and verification models must differ."; exit 2
          fi

      # ---- Install Open Trestle ---------------------------------------------
      # PLACEHOLDER (not usable today): no Open Trestle release artifact exists
      # yet. When one does, replace the build-from-source step below with a
      # download of a pinned version plus its checksum, for example:
      #
      #   - name: Install Open Trestle (PLACEHOLDER release artifact)
      #     run: |
      #       curl -fsSLO "https://example.invalid/open-trestle/vX.Y.Z/open-trestle-linux-amd64.pyz"
      #       curl -fsSLO "https://example.invalid/open-trestle/vX.Y.Z/open-trestle-linux-amd64.pyz.sha256"
      #       sha256sum -c open-trestle-linux-amd64.pyz.sha256
      #       sudo python3 ./open-trestle-linux-amd64.pyz install
      #
      # Working alternative: build the unsigned Linux candidate from source
      # (docs/operations.md). Remote egress needs this packaged build, because a
      # plain `go build` has no scanner digests and refuses remote requests.
      #
      # The install goes into a private folder. A hosted runner's /usr/local/bin
      # is writable by every user, and the installer refuses a system install
      # under a folder like that.
      - name: Fetch Open Trestle source at the pinned ref
        run: |
          git clone --no-tags "$OPEN_TRESTLE_REPOSITORY" "$RUNNER_TEMP/open-trestle-src"
          git -C "$RUNNER_TEMP/open-trestle-src" checkout --detach "$OPEN_TRESTLE_REF"

      - name: Set up Go for the packaging tool
        uses: actions/setup-go@v5 # Pin to a full commit SHA in your repository.
        with:
          go-version-file: ${{ runner.temp }}/open-trestle-src/go.mod

      - name: Build and install the packaged binary
        working-directory: ${{ runner.temp }}/open-trestle-src
        run: |
          python3 tools/package_secret_scanner.py --output .container
          python3 tools/package_secret_scanner.py --verify .container
          python3 tools/vulnerability_gate.py --staging .container
          REVISION="$(git rev-parse HEAD)"
          CREATED="$(date -u -d "$(git show -s --format=%cI "$REVISION")" +%Y-%m-%dT%H:%M:%SZ)"
          python3 tools/linux_distribution.py --staging .container --version 0.1.0-dev \
            --revision "$REVISION" --created "$CREATED" --output open-trestle-linux-amd64.pyz
          sha256sum -c open-trestle-linux-amd64.pyz.sha256
          install -d -m 0755 "$RUNNER_TEMP/open-trestle"
          ./open-trestle-linux-amd64.pyz install --destdir "$RUNNER_TEMP/open-trestle"
          echo "$RUNNER_TEMP/open-trestle/usr/local/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/open-trestle/usr/local/bin/trestle" build-info

      # ---- Configure the provider -------------------------------------------
      # Bootstrap records your declarations and prints the exact review command.
      # It makes no network or model call. ollama-cloud is used here because it
      # needs the fewest attestations; openrouter-zdr and opencode-go need account
      # and evidence declarations that only a human should make (see
      # docs/remote-model-review.md). Review the provider's privacy terms before
      # sending private source to it.
      #
      # The review base is the merge base of the pull request's base and head,
      # the same comparison GitHub shows for the pull request. pull_request.base.sha
      # is the base branch tip when the event fired; reviewing against it would
      # count commits merged into the base branch since the branch point as part
      # of this change. The SHAs arrive through env, never interpolated into run.
      - name: Bootstrap the provider configuration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE="$(git -C "$GITHUB_WORKSPACE" merge-base "$BASE_SHA" "$HEAD_SHA")" || {
            echo "::error::No merge base between the pull request base and head."; exit 2
          }
          case "$MERGE_BASE" in
            *[!0-9a-f]*|'') echo "::error::Unexpected merge base output."; exit 2 ;;
          esac
          install -d -m 0700 "$RUNNER_TEMP/trestle-review"
          trestle setup bootstrap init --provider ollama-cloud \
            --directory "$RUNNER_TEMP/trestle-review" \
            --tenant ci --repository "${GITHUB_REPOSITORY#*/}" \
            --checkout "$GITHUB_WORKSPACE" --base "$MERGE_BASE" --head "$HEAD_SHA" \
            --repository-authority github.com \
            --repository-namespace "${GITHUB_REPOSITORY%%/*}" \
            --repository-name "${GITHUB_REPOSITORY#*/}" \
            --generation-model "$GENERATION_MODEL" \
            --verification-model "$VERIFICATION_MODEL" \
            --generation-credential-environment OPEN_TRESTLE_PROVIDER_OLLAMA_CLOUD \
            --declared-by "$GITHUB_REPOSITORY" \
            --context-tokens 128000 --output-tokens 8192 \
            --input-micro-usd-per-million-tokens 0 --output-micro-usd-per-million-tokens 0 \
            --max-cost-micro-usd 0 \
            --declare-remote-route || status=$?
          # The key is not in this step's environment, so init reports the
          # setup as pending (exit 3). The review step runs check with the key.
          case "${status:-0}" in 0|3) ;; *) exit "$status" ;; esac

      # ---- Markdown escaping ------------------------------------------------
      # Untrusted text (model output in SARIF message.text and fix guidance,
      # and repository paths) reaches GitHub Markdown twice: in the job summary
      # and in reviewdog's pull-request comments. This jq module escapes it
      # with the rules of MarkdownText and MarkdownCode in localreview/render.go,
      # the renderer behind `--format markdown`: no emphasis, link, image,
      # heading, table cell, HTML tag or @-mention survives, and no URL, www.
      # host or email address becomes an autolink (a zero-width space breaks
      # each scheme colon, www. dot and @). SARIF itself keeps the raw text for
      # code scanning, which does not render message.text as Markdown. The
      # repository test TestExampleWorkflowEscapesUntrustedText runs this module
      # with jq against crafted SARIF and checks it byte for byte against the Go
      # renderer.
      - name: Write the Markdown escaping filter
        run: |
          cat > "$RUNNER_TEMP/trestle-markdown.jq" <<'JQ'
          def trestle_md_escapes: {"&": "&amp;", "<": "&lt;", ">": "&gt;", "@": "​@​", "\\": "\\\\", "*": "\\*", "_": "\\_", "[": "\\[", "]": "\\]", "(": "\\(", ")": "\\)", "#": "\\#", "!": "\\!", "|": "\\|", "`": "\\`", "~": "\\~"};
          def trestle_md:
            tostring
            | gsub("\r\n|\n|\r"; " ")
            | gsub("(?<c>[&<>@\\\\*_\\[\\]()#!|`~])"; trestle_md_escapes[.c])
            | gsub("(?<=[A-Za-z0-9]):(?=[^ ])"; "​:")
            | gsub("(?<![A-Za-z0-9])(?<w>[Ww][Ww][Ww])\\."; "\(.w)​.");
          def trestle_md_code:
            tostring
            | if . == "" or test("[`\r\n]") then trestle_md else "`" + gsub("\\|"; "\\|") + "`" end;
          def trestle_reviewdog:
            (.runs[]?.results[]?.message.text) |= (if type == "string" then trestle_md else . end)
            | del(.runs[]?.results[]?.message.markdown);
          def trestle_summary:
            .runs[0] as $r
            | "## Open Trestle review\n\n"
              + "Status: **\($r.properties.trestleModelReviewStatus | trestle_md)** (run: \($r.properties.trestleRunStatus | trestle_md), CI disposition: \($r.properties.trestleCiDisposition | trestle_md)); verified findings: \($r.results | length).\n\n"
              + ([$r.invocations[]?.toolExecutionNotifications[]? | "> \(.level | trestle_md): \(.message.text | trestle_md)\n"] | join(""))
              + "\n"
              + ([$r.results[]? | "- **\(.level | trestle_md)** \("\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)" | trestle_md_code) \(.message.text | trestle_md)\(if .properties.trestleFixGuidance then "\n  - Unverified model guidance: \(.properties.trestleFixGuidance | trestle_md)" else "" end)\n"] | join(""))
              + "\n_The review is bounded and is not a clearance. Fix guidance is model text the verifier did not check._\n";
          JQ

      # ---- Review -----------------------------------------------------------
      # Exit policy `findings`: exit 0 means the review completed and found no
      # verified high or critical issue; it is not a clearance of the change.
      # Exit 4 means a verified high/critical finding or a refusal; 3 means the
      # review could not read or finish the change; 1 means an internal failure.
      # This step records the status and always succeeds so that the SARIF is
      # uploaded; the last step turns the status into the job result.
      - name: Run the model review
        id: review
        env:
          # Map your repository secret onto the variable NAME recorded by bootstrap.
          OPEN_TRESTLE_PROVIDER_OLLAMA_CLOUD: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          # --repository-checks runs the repository's own tests in a sandbox
          # that needs unprivileged user namespaces, which ubuntu-24.04 runners
          # restrict. This lifts the restriction for this job's virtual machine.
          # Remove this line and the flag below to review without the checks.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          set +e
          trestle setup bootstrap check --directory "$RUNNER_TEMP/trestle-review" > "$RUNNER_TEMP/check.json"
          check=$?
          if [ "$check" -ne 0 ]; then
            jq -r '.messages[]' "$RUNNER_TEMP/check.json" | sed 's/^/::error::/'
            echo "status=$check" >> "$GITHUB_OUTPUT"; echo "sarif=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Take the printed command, drop its `--format text` pair, ask for SARIF.
          mapfile -t ARGS < <(jq -r '.review_command[3:] | (index("--format")) as $i | (.[:$i] + .[$i+2:])[]' "$RUNNER_TEMP/check.json")
          trestle local-git model-review "${ARGS[@]}" --repository-checks --format sarif --exit-code-policy findings \
            > "$RUNNER_TEMP/open-trestle.sarif" 2> "$RUNNER_TEMP/review.stderr"
          status=$?
          cat "$RUNNER_TEMP/review.stderr" >&2
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if jq -e '.version == "2.1.0"' "$RUNNER_TEMP/open-trestle.sarif" > /dev/null 2>&1; then
            echo "sarif=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif=false" >> "$GITHUB_OUTPUT"
          fi
          # Upload to code scanning only for a run that succeeded. A refused,
          # failed or canceled run's SARIF has no results, and uploading it for
          # the category could close the open alerts as if they were fixed.
          if jq -e '.runs[0].properties.trestleRunStatus == "succeeded"' "$RUNNER_TEMP/open-trestle.sarif" > /dev/null 2>&1; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # (a) Code scanning alerts. Needs code scanning to be available for the
      # repository (public repositories, or GitHub Code Security on private ones).
      #
      # upload-sarif defaults to github.sha, which for pull_request is the
      # temporary merge commit, not the head that was reviewed. `ref` and `sha`
      # bind the analysis to the reviewed pull request head instead. This step is
      # unverified live; its inputs are taken from the upload-sarif documentation.
      - name: Upload SARIF to code scanning
        if: ${{ always() && steps.review.outputs.upload == 'true' }}
        uses: github/codeql-action/upload-sarif@v4 # Pin to a full commit SHA in your repository.
        env:
          PULL_REQUEST_REF: refs/pull/${{ github.event.pull_request.number }}/head
        with:
          sarif_file: ${{ runner.temp }}/open-trestle.sarif
          category: open-trestle
          ref: ${{ env.PULL_REQUEST_REF }}
          sha: ${{ github.event.pull_request.head.sha }}

      # (b) Inline pull-request review comments through reviewdog. reviewdog only
      # comments on lines inside the pull request diff; other findings remain in
      # code scanning and in the job summary. Findings carry the verifier's claim;
      # fix guidance is in the SARIF properties and is unverified model text.
      # GitHub renders the comments as Markdown, so reviewdog reads a copy of the
      # SARIF whose message text is escaped by the filter above.
      - name: Set up reviewdog
        if: ${{ always() && steps.review.outputs.sarif == 'true' }}
        uses: reviewdog/action-setup@v1 # Pin to a full commit SHA in your repository.

      - name: Post inline review comments with reviewdog
        if: ${{ always() && steps.review.outputs.sarif == 'true' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          jq -L "$RUNNER_TEMP" 'include "trestle-markdown"; trestle_reviewdog' "$RUNNER_TEMP/open-trestle.sarif" > "$RUNNER_TEMP/open-trestle.reviewdog.sarif"
          reviewdog -f=sarif -name=open-trestle -reporter=github-pr-review \
            -filter-mode=added -fail-level=none < "$RUNNER_TEMP/open-trestle.reviewdog.sarif"

      # Job summary. One paid model run yields one output format, so the summary
      # is rendered from the SARIF rather than from a second `--format markdown`
      # run, with the same escaping rules as that renderer.
      - name: Write the job summary
        if: ${{ always() && steps.review.outputs.sarif == 'true' }}
        run: |
          jq -r -L "$RUNNER_TEMP" 'include "trestle-markdown"; trestle_summary' "$RUNNER_TEMP/open-trestle.sarif" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job from the review status
        if: ${{ always() }}
        env:
          STATUS: ${{ steps.review.outputs.status }}
        run: |
          echo "model-review exit status: ${STATUS:-unknown}"
          [ "${STATUS:-unknown}" = "0" ]
