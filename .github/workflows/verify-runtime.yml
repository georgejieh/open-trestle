name: Verify runtime

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            extensions/vscode/package-lock.json
      - name: Verify npm install request policy
        run: |
          test "$(npm config get audit --prefix web)" = "false"
          test "$(npm config get fund --prefix web)" = "false"
          test "$(npm config get update-notifier --prefix web)" = "false"
          test "$(npm config get audit --prefix extensions/vscode)" = "false"
          test "$(npm config get fund --prefix extensions/vscode)" = "false"
          test "$(npm config get update-notifier --prefix extensions/vscode)" = "false"
      - name: Verify web console
        run: |
          rm -rf "$RUNNER_TEMP/open-trestle-web-dist"
          cp -R web/dist "$RUNNER_TEMP/open-trestle-web-dist"
          npm ci --prefix web
          npm run format:check --prefix web
          npm test --prefix web
          npm run check --prefix web
          npm run build --prefix web
          npm run dist:check --prefix web
          diff -r "$RUNNER_TEMP/open-trestle-web-dist" web/dist
      - name: Verify VS Code extension
        run: |
          rm -rf "$RUNNER_TEMP/open-trestle-vscode-dist"
          cp -R extensions/vscode/dist "$RUNNER_TEMP/open-trestle-vscode-dist"
          npm ci --prefix extensions/vscode
          npm run format:check --prefix extensions/vscode
          npm test --prefix extensions/vscode
          npm run check --prefix extensions/vscode
          TZ=UTC npm run package --prefix extensions/vscode
          npm run dist:check --prefix extensions/vscode
          cp extensions/vscode/dist/open-trestle.vsix "$RUNNER_TEMP/open-trestle-first.vsix"
          TZ=America/Los_Angeles npm run package --prefix extensions/vscode
          cmp "$RUNNER_TEMP/open-trestle-first.vsix" extensions/vscode/dist/open-trestle.vsix
          diff -r "$RUNNER_TEMP/open-trestle-vscode-dist" extensions/vscode/dist
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify root module sums
        run: GOWORK=off GOTOOLCHAIN=go1.26.8 go mod verify
      - name: Run tests
        run: GOWORK=off GOTOOLCHAIN=go1.26.8 go test ./...
      - name: Verify static-debug evaluation evidence
        run: |
          GOWORK=off GOTOOLCHAIN=go1.26.8 go run ./cmd/trestle evaluate static-debug > "$RUNNER_TEMP/open-trestle-static-debug-evaluation.json"
          cmp evaluation/testdata/static-debug-report-v1.json "$RUNNER_TEMP/open-trestle-static-debug-evaluation.json"
      - name: Run race tests
        run: GOWORK=off GOTOOLCHAIN=go1.26.8 go test -race -p=1 -timeout=30m ./...
      - name: Run vet
        run: GOWORK=off GOTOOLCHAIN=go1.26.8 go vet ./...
      - name: Cross-compile root packages
        run: |
          GOWORK=off GOTOOLCHAIN=go1.26.8 CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -run='^$' -exec=true ./...
          GOWORK=off GOTOOLCHAIN=go1.26.8 CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go test -run='^$' -exec=true ./...
          GOWORK=off GOTOOLCHAIN=go1.26.8 CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go test -run='^$' -exec=true ./...
      - name: Run release-tool tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Set up secret-scanner Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: workers/secret-scanner/go.mod
          cache: false
      - name: Verify secret-scanner module sums
        working-directory: workers/secret-scanner
        run: GOWORK=off GOTOOLCHAIN=go1.25.12 go mod verify
      - name: Run secret-scanner tests
        working-directory: workers/secret-scanner
        run: GOWORK=off GOTOOLCHAIN=go1.25.12 go test -timeout=15m ./...
      - name: Run secret-scanner race tests
        working-directory: workers/secret-scanner
        run: GOWORK=off GOTOOLCHAIN=go1.25.12 go test -race -p=1 -timeout=30m ./...
      - name: Run secret-scanner vet
        working-directory: workers/secret-scanner
        run: GOWORK=off GOTOOLCHAIN=go1.25.12 go vet ./...
      - name: Provision pinned Zig musl builder and build deterministic release staging
        run: |
          python3 tools/package_secret_scanner.py
          python3 tools/package_secret_scanner.py --verify .container
      - name: Verify deterministic unsigned release evidence
        env:
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          RELEASE_CREATED="$(date -u -d "$(git show -s --format=%cI "$RELEASE_REVISION")" +%Y-%m-%dT%H:%M:%SZ)"
          python3 tools/release_evidence.py \
            --artifact container=.container \
            --artifact web=web/dist \
            --artifact vscode=extensions/vscode/dist/open-trestle.vsix \
            --go-binary .container/trestle \
            --go-binary .container/trestled \
            --go-binary .container/libexec/open-trestle/open-trestle-secret-scanner-worker \
            --npm-lock web/package-lock.json \
            --npm-lock extensions/vscode/package-lock.json \
            --version 0.1.0-dev \
            --revision "$RELEASE_REVISION" \
            --created "$RELEASE_CREATED" \
            --output "$RUNNER_TEMP/open-trestle-release-evidence-a"
          python3 tools/release_evidence.py \
            --artifact container=.container \
            --artifact web=web/dist \
            --artifact vscode=extensions/vscode/dist/open-trestle.vsix \
            --go-binary .container/trestle \
            --go-binary .container/trestled \
            --go-binary .container/libexec/open-trestle/open-trestle-secret-scanner-worker \
            --npm-lock web/package-lock.json \
            --npm-lock extensions/vscode/package-lock.json \
            --version 0.1.0-dev \
            --revision "$RELEASE_REVISION" \
            --created "$RELEASE_CREATED" \
            --output "$RUNNER_TEMP/open-trestle-release-evidence-b"
          diff -r "$RUNNER_TEMP/open-trestle-release-evidence-a" "$RUNNER_TEMP/open-trestle-release-evidence-b"
          python3 -m venv "$RUNNER_TEMP/open-trestle-spdx-validator"
          "$RUNNER_TEMP/open-trestle-spdx-validator/bin/pip" install --no-cache-dir --require-hashes -r tools/spdx-validator-requirements.txt
          "$RUNNER_TEMP/open-trestle-spdx-validator/bin/python" -m spdx_tools.spdx.clitools.pyspdxtools \
            --infile .container/release/secret-scanner.spdx.json \
            --version SPDX-2.3
          "$RUNNER_TEMP/open-trestle-spdx-validator/bin/python" -m spdx_tools.spdx.clitools.pyspdxtools \
            --infile "$RUNNER_TEMP/open-trestle-release-evidence-a/sbom.spdx.json" \
            --version SPDX-2.3
      - name: Build container image without a registry base
        run: docker build --network=none --tag open-trestle:verify .
      - name: Verify packaged scanner sandbox
        run: |
          python3 -c 'import json,struct,sys; body=json.dumps({"schema_version":1,"request_id":"f"*64,"sources":[{"ordinal":0,"content_base64":"eg=="}]},separators=(",",":")).encode(); sys.stdout.buffer.write(struct.pack(">I",len(body))+body)' > "$RUNNER_TEMP/scanner-request"
          docker run --rm --network=none --read-only --cap-drop=ALL --pids-limit=64 --memory=256m --security-opt=no-new-privileges=true -i --entrypoint /usr/local/libexec/open-trestle/open-trestle-secret-scanner open-trestle:verify --stdio-v1 < "$RUNNER_TEMP/scanner-request" > "$RUNNER_TEMP/scanner-response" 2> "$RUNNER_TEMP/scanner-stderr"
          test ! -s "$RUNNER_TEMP/scanner-stderr"
          python3 -c 'import json,struct,sys; data=open(sys.argv[1],"rb").read(); size=struct.unpack(">I",data[:4])[0]; doc=json.loads(data[4:]); assert size==len(data)-4 and doc["status"]=="complete" and doc["matches"]==[] and doc["scanner"]=="betterleaks" and doc["scanner_version"]=="v1.8.1" and doc["build_profile"]=="public_detect_run_re2_purego_go1.25.12_linux_amd64_v1"' "$RUNNER_TEMP/scanner-response"
